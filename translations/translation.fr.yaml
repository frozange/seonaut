# =============================================
# CONTEXT: Issue types. Name and description of the issue types. Displayed in the issue index page.
# =============================================
ERROR_50x: URL renvoyant un code de statut 50x
ERROR_50x_DESC: Ces erreurs sont généralement dues à un bug ou à une mauvaise configuration du serveur. Les pages concernées ne se chargent pas correctement et affichent une page d'erreur, ce qui décourage vos visiteurs et agace les moteurs de recherche.

ERROR_40x: URL renvoyant un code de statut 40x
ERROR_40x_DESC: Ces pages sont introuvables et vos visiteurs comme les moteurs de recherche s'y perdent. Cela peut laisser penser que votre site est mal entretenu. À terme, trop de liens cassés nuisent à l'efficacité de l'exploration et diluent l'autorité de votre site.

ERROR_30x: URL renvoyant un code de statut 30x
ERROR_30x_DESC: Ces URL provoquent des redirections qui envoient les visiteurs et les moteurs de recherche vers une autre page. Les redirections ralentissent le chargement, déroutent les internautes et gaspillent le budget de crawl.

ERROR_REDIRECT_CHAIN: URL provoquant une chaîne de redirections
ERROR_REDIRECT_CHAIN_DESC: Une chaîne de redirections se forme quand une URL redirige vers une autre URL qui redirige elle-même ailleurs. Elle frustre les internautes et complique l'exploration et l'indexation efficaces de votre contenu par les moteurs de recherche.

ERROR_REDIRECT_LOOP: URL provoquant une boucle de redirections
ERROR_REDIRECT_LOOP_DESC: Une boucle de redirections se produit quand deux URL (ou plus) se redirigent mutuellement, sans fin. Les visiteurs et les moteurs de recherche n'atteignent jamais la destination. Résultat, mauvaise expérience utilisateur, navigation cassée, et exploration et indexation de votre site impossibles.

ERROR_DUPLICATED_TITLE: Pages avec une balise title dupliquée
ERROR_DUPLICATED_TITLE_DESC: La balise title est l'un des éléments les plus importants du SEO on-page. Si plusieurs pages ont le même title, elles se concurrencent sur une même requête et brouillent la compréhension des moteurs de recherche.

ERROR_LONG_TITLE: Pages avec une balise title trop longue
ERROR_LONG_TITLE_DESC: "Google ne fixe aucune limite de longueur. Un title long est tronqué à la largeur de l'écran dans les résultats, Google conseille seulement d'éviter le verbiage."

ERROR_SHORT_TITLE: Pages avec une balise title trop courte
ERROR_SHORT_TITLE_DESC: "Google ne fixe aucune longueur de title. Il demande un title qui décrit précisément la page : « Accueil » ou « Blog » seul ne distingue pas la page des autres."

ERROR_EMPTY_TITLE: Pages sans balise title
ERROR_EMPTY_TITLE_DESC: La balise title aide les moteurs de recherche à comprendre le sujet d'une page et s'affiche souvent dans les résultats. Sans title, votre page peut être moins bien classée, passer inaperçue et paraître peu professionnelle ou inachevée.

ERROR_EMPTY_DESCRIPTION: Pages sans meta description
ERROR_EMPTY_DESCRIPTION_DESC: La meta description n'est pas un facteur de classement, mais les moteurs de recherche s'en servent souvent pour afficher les extraits dans les résultats.

ERROR_SHORT_DESCRIPTION: Pages avec une meta description trop courte
ERROR_SHORT_DESCRIPTION_DESC: La meta description n'est pas un facteur de classement, mais les moteurs de recherche s'en servent souvent pour afficher les extraits dans les résultats.

ERROR_LONG_DESCRIPTION: Pages avec une meta description trop longue
ERROR_LONG_DESCRIPTION_DESC: La meta description n'est pas un facteur de classement, mais une description de qualité permet d'afficher des informations plus pertinentes dans les résultats. Les descriptions trop longues sont souvent tronquées, ce qui les rend peu attractives pour les internautes.

ERROR_DUPLICATED_DESCRIPTION: Pages avec une meta description dupliquée
ERROR_DUPLICATED_DESCRIPTION_DESC: Il est recommandé de rédiger une description unique pour chaque page afin que les moteurs de recherche comprennent mieux votre contenu.

ERROR_LITTLE_CONTENT: Pages avec peu de contenu
ERROR_LITTLE_CONTENT_DESC: "Google indique que la longueur d'un texte ne compte pas pour le classement. Ce relevé signale seulement des pages courtes, à relire pour vérifier qu'elles répondent à la question du visiteur."

ERROR_IMAGES_NO_ALT: Pages contenant des images sans attribut alt
ERROR_IMAGES_NO_ALT_DESC: Le texte alternatif (attribut alt) améliore l'accessibilité de votre site et aide les moteurs de recherche à mieux comprendre vos images.

ERROR_NO_H1: Pages sans balise H1
ERROR_NO_H1_DESC: "Google n'impose ni H1 ni nombre de titres. Un titre principal visible aide surtout le visiteur et les lecteurs d'écran à saisir le sujet de la page."

ERROR_NO_LANG: Pages sans attribut de langue
ERROR_NO_LANG_DESC: L'attribut de langue est particulièrement utile aux lecteurs d'écran et son usage est recommandé. Certains moteurs de recherche s'en servent pour proposer la bonne page selon la langue de l'internaute, mais il n'influence pas votre classement.

ERROR_HTTP_LINKS: Pages HTTPS avec des liens vers des URL HTTP
ERROR_HTTP_LINKS_DESC: Liens depuis des pages sécurisées HTTPS vers des pages non sécurisées HTTP. Un site entièrement sécurisé se positionne mieux qu'un site sans HTTPS, et rassure davantage vos visiteurs.

ERROR_HREFLANG_RETURN: Pages sans hreflang de retour
ERROR_HREFLANG_RETURN_DESC: Quand une page en référence une autre avec hreflang, celle-ci doit à son tour la référencer avec une balise hreflang. Sans cette réciprocité, les moteurs de recherche peuvent ignorer les annotations hreflang et afficher la mauvaise version linguistique dans les résultats.

ERROR_TOO_MANY_LINKS: Pages avec trop de liens
ERROR_TOO_MANY_LINKS_DESC: "Google ne fixe pas de nombre maximal de liens par page. Une page très chargée en liens peut en revanche gêner le visiteur : vérifiez que chacun sert."

ERROR_INTERNAL_NOFOLLOW: Liens internes nofollow
ERROR_INTERNAL_NOFOLLOW_DESC: En règle générale, les liens internes ne doivent pas utiliser l'attribut nofollow, sauf s'ils pointent vers des pages que vous ne souhaitez pas voir indexées. Passez en revue vos liens internes et assurez-vous que les pages importantes sont liées sans nofollow.

ERROR_EXTERNAL_WITHOUT_NOFOLLOW: Pages avec des liens externes follow
ERROR_EXTERNAL_WITHOUT_NOFOLLOW_DESC: "Un lien ordinaire vers un autre site n'a besoin d'aucun attribut rel, selon Google. Seuls les liens payants (sponsored), les liens laissés par les internautes (ugc) et ceux que vous ne cautionnez pas (nofollow) doivent être qualifiés."

ERROR_CANONICALIZED_NON_CANONICAL: Canonicalisées vers une URL non canonique
ERROR_CANONICALIZED_NON_CANONICAL_DESC: Pages dont la balise canonical pointe vers une URL non canonique. Une page canonicalisée doit pointer vers une page canonique, remplacez donc l'URL canonical de ces pages pour qu'elle cible une URL canonique.

ERROR_NOT_VALID_HEADINGS: "Pages qui sautent un niveau de titre"
ERROR_NOT_VALID_HEADINGS_DESC: "Ces pages passent par exemple d'un H2 à un H4. Google indique dans son guide de démarrage SEO que l'ordre des titres ne compte pas pour la recherche. Un ordre continu aide en revanche les lecteurs d'écran à parcourir la page."

ERROR_HREFLANG_TO_NON_CANONICAL: Hreflang vers une page non canonique
ERROR_HREFLANG_TO_NON_CANONICAL_DESC: Les balises hreflang indiquent aux moteurs de recherche où trouver le contenu dans une langue donnée. Les faire pointer vers des pages non canoniques brouille leur compréhension.

ERROR_NOFOLLOW_INDEXABLE: Liens internes nofollow vers des pages indexables
ERROR_NOFOLLOW_INDEXABLE_DESC: Un lien interne nofollow demande aux moteurs de recherche de ne pas l'explorer. Pour que cela fonctionne, l'URL de destination doit porter la balise noindex, sinon les moteurs peuvent quand même l'indexer.

ERROR_NO_INDEXABLE: Pages non indexables
ERROR_NO_INDEXABLE_DESC: Les pages en noindex ne seront pas indexées par les moteurs de recherche. On l'applique en général aux pages secondaires que l'on ne veut pas voir dans les résultats. Il peut être utile de les passer en revue pour vérifier qu'aucune page importante n'est concernée.

ERROR_HREFLANG_NO_INDEXABLE: Hreflang vers une page non indexable
ERROR_HREFLANG_NO_INDEXABLE_DESC: Les hreflang doivent pointer vers des pages indexables. Les faire pointer vers des pages en noindex brouille les moteurs de recherche.

ERROR_BLOCKED: URL bloquées par le fichier robots.txt
ERROR_BLOCKED_DESC: Les pages bloquées par le fichier robots.txt ne seront pas explorées par les moteurs de recherche. Surveillez cette liste pour vous assurer qu'aucune page importante n'est bloquée.

ERROR_ORPHAN: Pages orphelines
ERROR_ORPHAN_DESC: Pages vers lesquelles aucun lien ne pointe sur votre site. Les visiteurs ne peuvent pas y accéder, ce qui peut entraîner un gaspillage de budget de crawl.

NO_INDEX_IN_SITEMAP: Pages non indexables présentes dans le sitemap
NO_INDEX_IN_SITEMAP_DESC: Les pages non indexables ne doivent pas figurer dans un sitemap, car cela envoie un signal contradictoire aux moteurs de recherche. Elles peuvent aussi ralentir l'exploration et fausser l'indexation.

BLOCKED_IN_SITEMAP: Pages bloquées présentes dans le sitemap
BLOCKED_IN_SITEMAP_DESC: Les pages bloquées par le fichier robots.txt ne doivent pas figurer dans le sitemap, car cela envoie un signal contradictoire aux moteurs de recherche. Elles peuvent aussi ralentir l'exploration et fausser l'indexation.

NON_CANONICAL_IN_SITEMAP: Pages non canoniques présentes dans le sitemap
NON_CANONICAL_IN_SITEMAP_DESC: Les pages non canoniques ne doivent pas figurer dans un sitemap, car elles peuvent induire les moteurs de recherche en erreur, gaspiller du temps et des ressources, et fausser l'indexation.

INCOMING_FOLLOW_NOFOLLOW: Pages avec des liens entrants follow et nofollow
INCOMING_FOLLOW_NOFOLLOW_DESC: Une page qui reçoit à la fois des liens internes follow et nofollow peut diluer les signaux d'autorité et de pertinence, ce qui brouille les moteurs de recherche et réduit ses chances de bien se positionner.

INVALID_LANG: Pages avec un attribut lang invalide
INVALID_LANG_DESC: Un attribut lang invalide peut poser problème aux moteurs de recherche comme aux internautes. Les moteurs peuvent avoir du mal à identifier la langue du contenu, et les visiteurs à le comprendre ou à utiliser des technologies d'assistance.

HTTP_SCHEME: Pages en HTTP
HTTP_SCHEME_DESC: Pages utilisant HTTP au lieu de HTTPS. Le HTTPS est important, car il rend votre site plus sûr et plus fiable, ce qui peut améliorer l'engagement des visiteurs et le positionnement dans les moteurs de recherche.

DEAD_END: Pages sans issue
DEAD_END_DESC: Une page sans issue ne contient aucun lien vers d'autres pages. Les visiteurs et les moteurs de recherche ne peuvent donc pas aller plus loin, ce qui complique l'exploration du site et nuit à l'expérience utilisateur comme à l'explorabilité.

ERROR_CANONICALIZED_NON_INDEXABLE: Canonicalisées vers une page non indexable
ERROR_CANONICALIZED_NON_INDEXABLE_DESC: Pages dont la balise canonical pointe vers d'autres pages non indexables. Cela revient à dire aux moteurs de recherche que la page non indexable est la version préférée du contenu, ce qui crée de la confusion et réduit les chances que ce contenu soit découvert.

ERROR_HREFLANG_REDIRECT: Hreflang vers une redirection
ERROR_HREFLANG_REDIRECT_DESC: Pages dont les liens hreflang pointent vers des pages redirigées avec un code de statut 30x. Les moteurs de recherche peuvent alors avoir du mal à comprendre la relation entre la page d'origine et la page de destination.

ERROR_CANONICAL_REDIRECT: Canonicalisées vers une redirection
ERROR_CANONICAL_REDIRECT_DESC: Pages dont la balise canonical pointe vers des URL redirigées au lieu de la véritable version préférée de la page. Cela peut brouiller la compréhension de votre site par les moteurs de recherche.

ERROR_HREFLANG_ERROR: Hreflang vers une erreur
ERROR_HREFLANG_ERROR_DESC: Pages dont les balises hreflang pointent vers des URL renvoyant une erreur (codes de statut 40x ou 50x). Les moteurs de recherche ne peuvent plus indexer correctement les différentes versions de votre page, ce qui peut nuire à votre positionnement.

ERROR_CANONICAL_ERROR: Canonicalisées vers une erreur
ERROR_CANONICAL_ERROR_DESC: Pages dont la balise canonical pointe vers des URL renvoyant une erreur (codes de statut 40x ou 50x). Les moteurs de recherche, incapables d'explorer votre version préférée de la page, peuvent s'y perdre.

ERROR_MULTIPLE_CANONICAL_TAGS: Balises canonical multiples
ERROR_MULTIPLE_CANONICAL_TAGS_DESC: Pages contenant plus d'une balise canonical dans l'en-tête. Plusieurs canonical brouillent la version préférée de la page pour les moteurs de recherche et peuvent causer des problèmes d'indexation et de classement.

ERROR_RELATIVE_CANONICAL_URL: Canonical avec une URL relative
ERROR_RELATIVE_CANONICAL_URL_DESC: Pages utilisant une URL relative dans la balise canonical. Même si certains moteurs de recherche les acceptent, les chemins relatifs peuvent causer à terme des problèmes d'indexation et de classement. Privilégiez des URL absolues.

ERROR_HREFLANG_XDEFAULT: Balise de langue par défaut manquante
ERROR_HREFLANG_XDEFAULT_DESC: Pages sans valeur hreflang "x-default". Indiquer la langue ou la région par défaut d'une page garantit une bonne indexation pour les internautes qui ne correspondent à aucune valeur hreflang précise.

ERROR_HREFLANG_SELF_REFERENCE: Auto-référence hreflang manquante
ERROR_HREFLANG_SELF_REFERENCE_DESC: Inclure une auto-référence dans les balises hreflang est essentiel pour préciser la langue ou la région de la page actuelle et éviter toute confusion chez les moteurs de recherche.

ERROR_HREFLANG_MISMATCHING_LANG: Langues incohérentes
ERROR_HREFLANG_MISMATCHING_LANG_DESC: Utiliser des codes de langue différents dans l'attribut lang du HTML et dans l'auto-référence hreflang peut troubler les moteurs de recherche, qui interprètent mal la langue ou la région de la page, au détriment de votre SEO.

ERROR_HREFLANG_RELATIVE_URL: Valeurs hreflang avec des URL relatives
ERROR_HREFLANG_RELATIVE_URL_DESC: Pages utilisant des URL relatives dans les valeurs hreflang. Les URL alternatives des balises hreflang doivent être absolues. Remplacez-les pour éviter les problèmes d'explorabilité et une mauvaise détection de la langue de la page.

ERROR_CANONICAL_MISMATCH: Canonical incohérente
ERROR_CANONICAL_MISMATCH_DESC: Pages dont l'URL canonique diffère entre le code HTML et les en-têtes HTTP. Cette incohérence peut tromper les moteurs de recherche et réduire votre positionnement et votre visibilité.

ERROR_MISSING_HSTS: En-tête HSTS manquant
ERROR_MISSING_HSTS_DESC: Pages sans en-tête HSTS. L'absence de l'en-tête HTTP Strict Transport Security expose davantage le site aux menaces de sécurité, ce qui peut jouer sur le SEO via la sécurité et la confiance des utilisateurs.

ERROR_MISSING_CSP: Content Security Policy manquante
ERROR_MISSING_CSP_DESC: Les pages sans balise meta ou en-tête HTTP CSP (Content Security Policy) sont plus exposées aux menaces de sécurité, avec un risque de contenu malveillant ou d'expérience utilisateur compromise, ce que les moteurs de recherche peuvent pénaliser.

ERROR_CONTENT_TYPE_OPTIONS: Options de type de contenu manquantes
ERROR_CONTENT_TYPE_OPTIONS_DESC: Pages sans en-tête X-Content-Type-Options, ce qui expose le site à des risques de sécurité liés au type de contenu, avec d'éventuelles pénalités SEO et une expérience utilisateur peu sûre.

ERROR_LARGE_IMAGE: Images volumineuses
ERROR_LARGE_IMAGE_DESC: Les images volumineuses ralentissent le chargement d'une page et nuisent à l'expérience utilisateur comme au classement SEO. N'utilisez de grandes images que lorsque c'est indispensable et optimisez-les à une taille raisonnable.

ERROR_LONG_ALT_TEXT: Images avec un texte alternatif trop long
ERROR_LONG_ALT_TEXT_DESC: Pages contenant des images dont l'attribut alt est trop long. Un texte alternatif trop long rend le contenu et la fonction de l'image plus difficiles à comprendre. Gardez un texte alternatif court et précis.

ERROR_MULTIPLE_TITLES: Balises title multiples
ERROR_MULTIPLE_TITLES_DESC: Pages contenant plus d'une balise title dans l'en-tête. Plusieurs balises title dans l'en-tête HTML peuvent nuire au SEO en perturbant les moteurs de recherche, qui comprennent alors plus difficilement le contenu de la page.

ERROR_MULTIPLE_DESCRIPTIONS: Balises meta description multiples
ERROR_MULTIPLE_DESCRIPTIONS_DESC: Pages contenant plus d'une balise meta description dans l'en-tête. Plusieurs balises meta description dans l'en-tête HTML peuvent nuire au SEO en perturbant les moteurs de recherche, qui comprennent alors plus difficilement le contenu de la page.

ERROR_PAGE_DEPTH: Profondeur élevée
ERROR_PAGE_DEPTH_DESC: Les pages trop profondes peuvent nuire au SEO et à l'expérience utilisateur. Difficiles d'accès pour les moteurs de recherche comme pour les internautes, elles risquent de perdre en visibilité dans les résultats et de rendre la navigation moins intuitive.

ERROR_MULTIPLE_LANG_REFERENCE: Références de langue multiples
ERROR_MULTIPLE_LANG_REFERENCE_DESC: Les pages qui référencent plusieurs langues dans leurs balises hreflang peuvent troubler les moteurs de recherche, entraîner une mauvaise indexation linguistique et nuire au SEO comme à l'expérience utilisateur.

ERROR_DUPLICATED_CONTENT: Contenu dupliqué
ERROR_DUPLICATED_CONTENT_DESC: Des pages au contenu strictement identique peuvent troubler les moteurs de recherche, qui peinent à déterminer la page la plus pertinente. Il en résulte des problèmes d'indexation, un classement dilué et un budget de crawl gaspillé.

ERROR_EXTERNAL_LINK_REDIRECT: Pages avec des liens externes vers des redirections
ERROR_EXTERNAL_LINK_REDIRECT_DESC: Des liens externes vers des pages redirigées n'affectent pas le positionnement de votre site, mais peuvent dégrader l'expérience utilisateur. Pour corriger, remplacez ces liens par leur destination finale.

ERROR_EXTERNAL_LINK_BROKEN: Pages avec des liens externes cassés
ERROR_EXTERNAL_LINK_BROKEN_DESC: Les liens externes cassés n'affectent pas le positionnement de votre site, mais ils frustrent les internautes en les menant vers des pages inexistantes. Supprimez-les ou mettez-les à jour avec la bonne URL.

ERROR_TIMEOUT: Délai d'attente dépassé
ERROR_TIMEOUT_DESC: Pages dont le délai d'attente a été dépassé lors de l'accès par notre robot. Dans ce cas, les robots des moteurs de recherche risquent de ne pas pouvoir accéder au contenu ni l'indexer, ce qui peut révéler des problèmes serveur ou des incidents temporaires nuisant à la visibilité.

ERROR_UNDERSCORE_URL: URL contenant des tirets bas
ERROR_UNDERSCORE_URL_DESC: Il est déconseillé d'utiliser des tirets bas (underscores) dans les URL, car certains moteurs de recherche les ignorent et traitent le segment comme un seul mot. Utilisez plutôt un tiret comme séparateur de mots.

ERROR_SLOW_TTFB: Temps de réponse initial (TTFB) lent
ERROR_SLOW_TTFB_DESC: Un TTFB lent dégrade l'expérience utilisateur et nuit au SEO en allongeant les temps de chargement, certains moteurs de recherche prenant la vitesse des pages en compte dans leur classement.

ERROR_HTTP_FORM: Formulaires sur des pages HTTP
ERROR_HTTP_FORM_DESC: Pages HTTP contenant des formulaires. Un formulaire sur une URL HTTP compromet la sécurité, réduit la confiance des utilisateurs et pénalise le SEO. Assurez-vous que vos formulaires sont sur des pages HTTPS.

ERROR_INSECURE_FORM: Formulaires non sécurisés
ERROR_INSECURE_FORM_DESC: Pages contenant des formulaires dont l'URL d'action est en HTTP. Un tel formulaire expose les données à l'interception, réduit la confiance, déclenche des alertes du navigateur et pénalise le SEO.

ERROR_SPACE_URL: URL contenant une espace
ERROR_SPACE_URL_DESC: Une espace dans l'URL peut causer des problèmes d'indexation et des liens cassés, au détriment du SEO et de l'expérience utilisateur. Utilisez des tirets comme séparateurs de mots plutôt que des espaces.

ERROR_MULTIPLE_SLASHES: URL avec plusieurs barres obliques dans le chemin
ERROR_MULTIPLE_SLASHES_DESC: URL contenant plusieurs barres obliques consécutives dans le chemin. Cela peut troubler les moteurs de recherche et les internautes, provoquer des problèmes d'indexation et donner un aspect moins propre et moins professionnel.

ERROR_NOIMAGEINDEX: Pages avec la directive noimageindex
ERROR_NOIMAGEINDEX_DESC: La directive noimageindex de la balise meta robots empêche l'indexation des images par les moteurs de recherche. Passez ces pages en revue pour vérifier que leurs images ne doivent effectivement pas être indexées.

ERROR_PICTURE_MISSONG_IMG: Pages avec des éléments picture sans élément img
ERROR_PICTURE_MISSONG_IMG_DESC: Pages utilisant un élément HTML picture dépourvu d'élément img. Les images risquent de ne pas s'afficher correctement dans le navigateur et de poser des problèmes d'indexation dans les moteurs de recherche d'images.

ERROR_METAS_IN_BODY: Pages avec des balises meta dans le corps du document
ERROR_METAS_IN_BODY_DESC: Pages contenant des balises meta dans le corps du document. Les balises meta doivent se trouver dans le head, faute de quoi elles risquent d'être ignorées par les navigateurs et les moteurs de recherche, avec des problèmes d'indexabilité à la clé.

ERROR_NOSNIPPET: Pages avec la directive nosnippet
ERROR_NOSNIPPET_DESC: Les directives nosnippet ou max-snippet:0 demandent aux moteurs de recherche de ne pas afficher d'extrait de texte ni d'aperçu vidéo dans les résultats. Passez ces pages en revue pour vérifier que c'est bien le comportement voulu.

ERROR_IMG_SIZE_ATTR: Pages avec des images sans attributs de taille
ERROR_IMG_SIZE_ATTR_DESC: Ne pas définir la taille des images provoque des décalages de mise en page pendant le chargement, ce qui nuit à l'expérience utilisateur comme au SEO. Vérifiez que vos images ont leurs attributs de taille.

ERROR_INCORRECT_MEDIA_TYPE: URL avec un type de média incorrect
ERROR_INCORRECT_MEDIA_TYPE_DESC: Des URL avec un type MIME incorrect peuvent nuire au SEO, car les navigateurs risquent d'interpréter mal le contenu ou de ne pas l'afficher, ce qui affecte l'expérience utilisateur et l'indexation.

ERROR_DUPLICATED_ID: Pages contenant des éléments avec des ID dupliqués
ERROR_DUPLICATED_ID_DESC: Des éléments avec des ID dupliqués perturbent les technologies d'assistance et JavaScript, entraînant des problèmes de navigation et des comportements imprévisibles. Cela peut nuire à l'expérience utilisateur et au SEO. Assurez-vous que chaque ID est unique.

ERROR_MISSING_VIEWPORT: Pages sans balise meta viewport
ERROR_MISSING_VIEWPORT_DESC: Une page sans balise meta viewport ne s'affiche pas correctement sur mobile, ce qui dégrade l'expérience utilisateur et le positionnement dans les résultats de recherche.

ERROR_DOM_SIZE: Documents HTML avec un DOM trop volumineux
ERROR_DOM_SIZE_DESC: Un DOM volumineux ralentit le chargement des pages et complique l'exploration et l'indexation efficaces du contenu par les moteurs de recherche. Simplifiez votre structure HTML en supprimant les éléments inutiles et en limitant l'imbrication des balises.

ERROR_PAGINATION_LINKS: URL de pagination sans lien
ERROR_PAGINATION_LINKS_DESC: Des balises link rel="next" et link rel="prev" sans liens correspondants dans le corps de la page troublent les moteurs de recherche, d'où une mauvaise indexation et une navigation frustrante.

ERROR_LOCALHOST_LINKS: Pages avec des liens vers localhost
ERROR_LOCALHOST_LINKS_DESC: Les liens vers localhost ou 127.0.0.1 sont inaccessibles aux internautes et aux moteurs de recherche, ce qui provoque des erreurs et nuit au SEO. Remplacez-les par les bonnes URL publiques de votre site en ligne.

# Protections of a public instance
ERROR_TOO_MANY_ATTEMPTS: Trop de tentatives. Veuillez patienter un moment avant de réessayer.
ERROR_HUMAN_CHECK: La vérification de sécurité a échoué. Veuillez recharger la page et réessayer.
ERROR_INVALID_PASSWORD: Le mot de passe n'est pas valide.
ERROR_INVALID_EMAIL: L'adresse e-mail n'est pas valide.
ERROR_MAIL_NOT_SENT: L'e-mail de confirmation n'a pas pu être envoyé. Veuillez réessayer plus tard.
VERIFY_EMAIL_SENT: C'est presque fini. Nous vous avons envoyé un e-mail contenant un lien d'activation de votre compte. Ce lien est valable 24 heures.
VERIFY_EMAIL_PENDING: Votre compte n'est pas encore actif. Nous vous avons envoyé un nouveau lien d'activation, vérifiez votre boîte de réception.
VERIFY_EMAIL_INVALID: Ce lien d'activation est invalide ou a expiré. Connectez-vous pour en recevoir un nouveau.
ERROR_CRAWL_LIMIT: Vous avez atteint le nombre d'explorations autorisées par jour. Veuillez réessayer demain.
ERROR_INSTANCE_BUSY: Le robot est occupé par d'autres explorations. Veuillez réessayer dans quelques minutes.
ERROR_PROJECT_LIMIT: Vous avez atteint le nombre maximal de projets. Supprimez un projet pour en ajouter un nouveau.


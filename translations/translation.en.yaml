AUDIT_DUPS_GROUPS: "Groups of copies: %1%"
AUDIT_DUPS_TEXT_HELP: "Keep one of these pages and redirect the others to it, or give each its own text."
AUDIT_DUPS_SIMILAR: "%1% % shared text"
AUDIT_PRIO_SPEED: "Speed your visitors live on phones"
AUDIT_PRIO_SPEED_DESC: "Google's real visitor measurements show a slow or unstable page on phones."
AUDIT_PRIO_STRUCTURED: "Product pages badly described for Google"
AUDIT_PRIO_STRUCTURED_DESC: "An error in the structured data keeps Google from showing price, availability or reviews in its results."
AUDIT_PRIO_DUPLICATES: "Pages with copied text"
AUDIT_PRIO_DUPLICATES_DESC: "Several pages repeat almost word for word the same text: Google usually keeps one and leaves the others aside."
AUDIT_PRIO_LINKING: "Pages no other page links to"
AUDIT_PRIO_LINKING_DESC: "None of your pages links to them: visitors cannot reach them, and Google finds them only through the sitemap, if it lists them."
AUDIT_METHOD_SPEED: "Speed comes from Google's PageSpeed Insights API. Real visitor measurements (Chrome User Experience Report, 28 days) are kept apart from the simulation, used only to find causes. A failed measurement shows no figure."
AUDIT_METHOD_SD: "Structured data is read on every page (JSON-LD and microdata) and checked against the required and recommended properties of Google's rich result documentation, with rules taken from Adobe's open source validator."
AUDIT_METHOD_LINKS: "Ease of access applies the classic link calculation (PageRank, taken from the open source LibreCrawl) to your internal links only, brought to 0 to 100. It is a LaFactory benchmark: Google publishes no such score and only says it finds pages by following links."
AUDIT_METHOD_DUPS: "Two pages are copies when at least 85% of their five-word sequences appear in both texts, menus and footer aside, translations set apart."
AUDIT_METHOD_SUGGEST: "Target searches come from our reading of the pages, then are checked against Google's suggestions (the list shown while typing in the search box). A search Google does not propose, even in a close form, is left out. Suggestions give no search volume."
AUDIT_LINKS_ORPHANS: "Pages no other page links to: %1%. Google can find them only through the sitemap."
AUDIT_POP: "Backlinks"
AUDIT_POP_HELP: "Common Crawl survey, %1% to %2%."
AUDIT_POP_ABSENT_CHIP: "Not in the sample yet"
AUDIT_POP_ABSENT: "%1% does not appear in the Common Crawl survey yet, which covers only part of the web."
AUDIT_POP_SITES: "sites link to yours"
AUDIT_POP_SITE_ONE: "site links to yours"
AUDIT_POP_NONE: "No site in the survey links to yours yet."
AUDIT_POP_RANK: "Your site ranks %1% out of %2%."
AUDIT_POP_TOP_PCT: "It is among the %1%% best linked sites of this sample."
AUDIT_POP_RANK_HELP: "This rank is a LaFactory benchmark. Common Crawl computes it from the links between all the sites of the sample (harmonic centrality): the smaller it is, the closer your site is to the others through links. Google publishes no link score, and this rank does not claim to be one."
AUDIT_NUM: "%1%"
AUDIT_POP_COL_SITE: "Site"
AUDIT_POP_COL_RANK: "Rank"
AUDIT_POP_RANK_SHORT: "rank %1%"
AUDIT_POP_TOP: "The main ones"
AUDIT_POP_GAINED: "New this quarter: %1%"
AUDIT_POP_LOST: "Gone this quarter: %1%"
AUDIT_POP_LOST_HELP: "Most often Common Crawl did not revisit the page carrying the link: it was not necessarily removed."
AUDIT_POP_NEW: "Your site was not in the previous survey: the comparison starts with the next one."
AUDIT_POP_NO_PREVIOUS: "The comparison with the previous quarter comes with the next survey."
AUDIT_POP_SAMPLE: "Common Crawl covers only part of the web: paid tools find more links."
AUDIT_VS: "You and your competitors"
AUDIT_VS_HELP: "The same measures, in the same sample, for the competitor sites you gave us."
AUDIT_VS_YOU: "you"
AUDIT_VS_SITES: "%1% sites link to it"
AUDIT_VS_SITES_ONE: "1 site links to it"
AUDIT_VS_GAP: "Link to your competitors, not to you: %1%"
AUDIT_VS_GAP_HELP_2: "Each links to at least two of your competitors. These sites already talk about your trade: they are the first ones to show yours to."
AUDIT_VS_GAP_HELP_1: "Each links to your competitor and none to you. These sites already talk about your trade: they are the first ones to show yours to."
AUDIT_VS_CITES: "links to"
AUDIT_METHOD_POP: "Backlinks come from Common Crawl's quarterly survey, which gives for each site the other sites linking to it. Google uses links among many other signals but publishes no link score. We call no link \"toxic\": Google ignores on its own those it deems artificial."
ERROR_CANONICAL_OTHER_LANGUAGE: "Pages whose main (canonical) version is in another language"
ERROR_CANONICAL_OTHER_LANGUAGE_DESC: "These pages name as their main version a page written in another language, often the home page. Google asks for a canonical in the same language: otherwise it may keep only the named page and drop these translations from its results."
AUDIT_REPORT_LEAD_SAMPLE: "Report based on the first %1% pages crawled: the site has more, this audit's limit was reached."
AUDIT_SD_PAGES_ONE: "Present on 1 page."
